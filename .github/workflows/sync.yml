name: Data sync (cron + manual)

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch: # manual trigger (SPA Re-sync button → /api/resync → dispatch)

permissions:
  contents: write

# One Data sync at a time: two runs would both burn the shared GitHub
# API budget (and the second would re-fetch what the first already did).
# A queued run waits instead of cancelling the in-progress one.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for wrangler (>=22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm packages so `npm ci` in Build worker does not
          # re-download everything every run (same as deploy-pages.yml).
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Create R2 bucket (idempotent)
        # The worker reads graph.json + search.json from this bucket at cold
        # start; the objects are ~20 MB total (free tier: 10 GB storage).
        # `|| true`: creating an existing bucket fails, and that is fine.
        run: |
          cd worker
          npx wrangler r2 bucket create graphrag-data || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore awesome-list fetch cache from R2
        # The fetch cache (scripts/.awesome_cache.json) holds list READMEs +
        # metadata; entries older than 7 days are refetched by sync_awesome.py.
        # It lives in R2 now — the actions/cache save step was silently
        # skipped every run, so no awesome-cache was ever stored and every
        # run re-fetched all 673 lists. `|| true`: first run has no cache yet.
        run: |
          cd worker
          npx wrangler r2 object get graphrag-data/cache/awesome_cache.json --file=../scripts/.awesome_cache.json --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Restore item metadata cache from R2
        # The item cache (scripts/.item_cache.json) holds per-item repo
        # metadata (stars, pushedAt, archived); entries older than 7 days
        # are re-resolved by sync_awesome.py. Same pattern as the list
        # cache. `|| true`: first run has no cache yet.
        run: |
          cd worker
          npx wrangler r2 object get graphrag-data/cache/item_cache.json --file=../scripts/.item_cache.json --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install python deps
        run: |
          cd scripts
          uv venv .venv
          uv pip install --python .venv/bin/python openpyxl

      - name: Regenerate graph via GitHub API
        run: |
          cd scripts
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" .venv/bin/python sync_data_v2.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download awesome README (knowledge-base source)
        run: |
          cd scripts
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/Nileshsri2022/awesome/readme \
            -o awesome-readme.md
          test -s awesome-readme.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build awesome layer (lists + items)
        run: |
          cd scripts
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" .venv/bin/python sync_awesome.py \
            --readme awesome-readme.md --full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save item metadata cache to R2
        # Save right after the awesome layer is built, so the cache persists
        # even if a later step (index, validation, deploy) fails.
        run: |
          cd worker
          npx wrangler r2 object put graphrag-data/cache/item_cache.json --file=../scripts/.item_cache.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save awesome-list fetch cache to R2
        # Save right after the awesome layer is built, so the cache persists
        # even if a later step (index, validation, deploy) fails.
        run: |
          cd worker
          npx wrangler r2 object put graphrag-data/cache/awesome_cache.json --file=../scripts/.awesome_cache.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build TF-IDF search index
        run: |
          cd scripts
          .venv/bin/python build_search_index.py ../data/graph.json \
            --out ../data/search.json

      - name: Build data shards (catalog + term-map + per-section)
        run: |
          cd scripts
          .venv/bin/python build_shards.py ../data/graph.json ../data/search.json \
            --out ../data/shards

      - name: Validate generated graph (schema/size/counts)
        run: |
          cd scripts
          .venv/bin/python -c "
          import json, os
          g = json.load(open('../data/graph.json'))
          m = g['meta']
          assert m['repoCount'] > 0, 'repoCount is 0'
          assert m.get('listCount', 0) > 0, 'listCount is 0 — awesome layer missing'
          assert len(g['nodes']) < 100000 and len(g['edges']) < 200000, 'graph exceeds hard caps'
          assert m['nodeCount'] == len(g['nodes']), 'nodeCount mismatch'
          assert m['edgeCount'] == len(g['edges']), 'edgeCount mismatch'
          ids = {n['id'] for n in g['nodes']}
          for e in g['edges']:
              assert e['source'] in ids and e['target'] in ids, f'edge references missing node: {e}'
              assert '|' not in e['source'] and '|' not in e['target'], 'edge id contains delimiter'
          size = os.path.getsize('../data/search.json')
          assert size <= 20 * 1024 * 1024, f'search.json exceeds 20 MB: {size} bytes'
          print('graph validation OK:', m['nodeCount'], 'nodes,', m['edgeCount'], 'edges,',
                m['listCount'], 'lists,', m.get('skippedLists'), 'skipped,',
                'search.json', size, 'bytes')
          "

      - name: Upload shards to R2
        # The 30 objects (catalog + term-map + 28 per-section shards) are
        # uploaded in parallel, 8 at a time — the puts are independent, and
        # the sequential loop took ~5s. Any failed put fails the step:
        # every background job's exit status is collected by `wait` below.
        # (wrangler is already in the npx cache from the earlier steps in
        # this run, so the parallel `npx` calls do not race on downloading it.)
        run: |
          cd worker
          upload() {
            npx wrangler r2 object put "$1" --file="$2" --remote
          }
          pids=()
          start() {
            # Wait for a free slot when 8 uploads are already running.
            while [ "$(jobs -rp | wc -l)" -ge 8 ]; do
              sleep 0.5
            done
            upload "$1" "$2" &
            pids+=($!)
          }
          start graphrag-data/catalog.json ../data/shards/catalog.json
          start graphrag-data/termmap.json ../data/shards/termmap.json
          for f in ../data/shards/shards/*.json; do
            start "graphrag-data/shards/$(basename "$f")" "$f"
          done
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit "$fail"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build worker
        # No `npm test` here: the test suite runs in ci.yml on every push /
        # pull request (same `npm test`, plus the frontend build), so the
        # sync run does not re-run it. The typecheck stays as a deploy gate.
        run: |
          cd worker
          npm ci
          npx tsc --noEmit

      - name: Deploy worker
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
