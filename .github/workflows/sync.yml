name: Data sync (cron + manual)

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch: # manual trigger (SPA Re-sync button → /api/resync → dispatch)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore awesome-list fetch cache
        uses: actions/cache@v4
        with:
          # Unique key per run so the updated cache is saved back; the
          # restore-key prefix pulls the newest previous run's cache.
          # The cache holds list READMEs + metadata (scripts/.awesome_cache.json);
          # entries older than 7 days are refetched by sync_awesome.py.
          path: scripts/.awesome_cache.json
          key: awesome-cache-v1-${{ github.run_id }}
          restore-keys: |
            awesome-cache-v1-

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install python deps
        run: |
          cd scripts
          uv venv .venv
          uv pip install --python .venv/bin/python openpyxl

      - name: Regenerate graph via GitHub API
        run: |
          cd scripts
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" .venv/bin/python sync_data_v2.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download awesome README (knowledge-base source)
        run: |
          cd scripts
          curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/Nileshsri2022/awesome/readme \
            -o awesome-readme.md
          test -s awesome-readme.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build awesome layer (lists + items)
        run: |
          cd scripts
          GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" .venv/bin/python sync_awesome.py \
            --readme awesome-readme.md --full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build TF-IDF search index
        run: |
          cd scripts
          .venv/bin/python build_search_index.py ../data/graph.json \
            --out ../data/search.json

      - name: Validate generated graph (schema/size/counts)
        run: |
          cd scripts
          .venv/bin/python -c "
          import json, os
          g = json.load(open('../data/graph.json'))
          m = g['meta']
          assert m['repoCount'] > 0, 'repoCount is 0'
          assert m.get('listCount', 0) > 0, 'listCount is 0 — awesome layer missing'
          assert len(g['nodes']) < 100000 and len(g['edges']) < 200000, 'graph exceeds hard caps'
          assert m['nodeCount'] == len(g['nodes']), 'nodeCount mismatch'
          assert m['edgeCount'] == len(g['edges']), 'edgeCount mismatch'
          ids = {n['id'] for n in g['nodes']}
          for e in g['edges']:
              assert e['source'] in ids and e['target'] in ids, f'edge references missing node: {e}'
              assert '|' not in e['source'] and '|' not in e['target'], 'edge id contains delimiter'
          size = os.path.getsize('../data/search.json')
          assert size <= 10 * 1024 * 1024, f'search.json exceeds 10 MB: {size} bytes'
          print('graph validation OK:', m['nodeCount'], 'nodes,', m['edgeCount'], 'edges,',
                m['listCount'], 'lists,', m.get('skippedLists'), 'skipped,',
                'search.json', size, 'bytes')
          "

      - name: Commit updated snapshot
        run: |
          git config user.name "graphrag-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # -f: data/graph.json is git-ignored for local dev; the workflow
          # force-adds it (and data/search.json) as the git backup of the
          # snapshot that also goes to R2. worker/data/* are the sync base
          # graph + test fixtures and are never written by the sync.
          git add -f data/graph.json data/search.json
          if git diff --cached --quiet; then
            echo "no changes — snapshot is fresh"
          else
            git commit -m "chore(data): automatic graph refresh (cron)"
            git push origin main
          fi

      - name: Setup Node for wrangler (>=22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create R2 bucket (idempotent)
        # The worker reads graph.json + search.json from this bucket at cold
        # start; the objects are ~20 MB total (free tier: 10 GB storage).
        # `|| true`: creating an existing bucket fails, and that is fine.
        run: |
          cd worker
          npx wrangler r2 bucket create graphrag-data || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload data to R2
        run: |
          cd worker
          npx wrangler r2 object put graphrag-data/graph.json --file=../data/graph.json
          npx wrangler r2 object put graphrag-data/search.json --file=../data/search.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build worker
        run: |
          cd worker
          npm ci
          npx tsc --noEmit
          npm test

      - name: Deploy worker
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
