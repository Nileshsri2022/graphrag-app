name: CI — typecheck, audits, worker dry-run

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: cd worker && npm ci
      - name: Typecheck
        run: cd worker && npx tsc --noEmit
      - name: npm audit (high+)
        run: cd worker && npm audit --audit-level=high
      - name: wrangler deploy — dry run
        run: cd worker && npx wrangler deploy --dry-run --outdir /tmp/wrangler-dist

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build
      - name: npm audit (high+)
        run: cd frontend && npm audit --audit-level=high

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit
        run: |
          uv venv /tmp/scratch
          uv pip install --python /tmp/scratch/bin/python pip-audit
          /tmp/scratch/bin/pip-audit --path scripts
